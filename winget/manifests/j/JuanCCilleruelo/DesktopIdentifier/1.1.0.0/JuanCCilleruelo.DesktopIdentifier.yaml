ShortDescription: Visual band and floating badge to tell cloned Windows machines apart.
Description: Desktop Identifier adds a colored band to the wallpaper and a floating, click-through badge to identify cloned Windows virtual machines at a glance. Configure the text, colors, size, opacity, corners and band alignment; badge and band colors can be synchronized. The badge does not capture the mouse, starts with Windows, and the UI is available in Spanish, English, French, Italian and German.
